{% extends 'core/header.html' %}

{% block extra_css %}
<style>
  .auth-wrap { padding: 40px 24px; display: flex; flex-direction: column; gap: 16px; align-items: flex-start; }
  .auth-icon { width: 64px; height: 64px; border-radius: 50%; background: #D2F4D1; display: flex; align-items: center; justify-content: center; font-size: 30px; }
  .auth-wrap h1 { font-family: var(--font-title); font-size: 24px; font-weight: 800; color: var(--text-dark); }
  .auth-wrap p { font-size: 14px; line-height: 1.6; color: var(--text-muted); }
  .auth-btn {
    width: 100%; border: none; border-radius: 9999px; padding: 16px; text-align: center;
    background: linear-gradient(135deg, #2E7D32 0%, #43A047 100%); color: white;
    font-family: var(--font-title); font-weight: 700; font-size: 16px;
    text-decoration: none; display: block; margin-top: 6px;
  }
  .auth-btn:hover { opacity: 0.94; }
</style>
{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="auth-icon"><i class="ic fi-br-check-circle"></i></div>
  <h1>Mot de passe modifié</h1>
  <p>Votre mot de passe a été réinitialisé avec succès. Vous pouvez maintenant vous connecter.</p>
  <a href="{% url 'connexion' %}" class="auth-btn">Se connecter</a>
</div>
{% endblock %}
