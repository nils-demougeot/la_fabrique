{% extends 'core/header.html' %}

{% block extra_css %}
<style>
  /* Page volontairement vide pour l'instant : le placeholder ci-dessous
     n'est là que pour éviter un écran totalement blanc pendant le redesign.
     Supprimer .cours-vide quand le vrai contenu arrive. */
  .cours-vide {
    min-height: 100%;
    padding: 72px 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 14px;
  }
  .cours-vide__pastille {
    width: 76px; height: 76px; border-radius: 50%;
    background: #FFF6DC; color: #B98400;
    display: flex; align-items: center; justify-content: center;
    font-size: 30px;
  }
  .cours-vide h1 {
    font-family: 'Bricolage Grotesque', var(--font-title);
    font-size: 22px; font-weight: 800; color: var(--text-dark);
  }
  .cours-vide p {
    font-size: 15px; line-height: 1.6; color: var(--text-muted); max-width: 300px;
  }
</style>
{% endblock %}

{% block content %}
<div class="cours-vide">
  <div class="cours-vide__pastille"><i class="ic fi-br-graduation-cap"></i></div>
  <h1>Cours</h1>
  <p>Cette rubrique est en cours de construction.</p>
</div>
{% endblock %}

{% block bottom_nav %}
  {% with nav_active='cours' %}
    {% include 'core/bottom_nav.html' %}
  {% endwith %}
{% endblock %}
